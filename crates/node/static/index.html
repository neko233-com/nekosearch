<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nekosearch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234285f4'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3En%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --blue: #4285f4;
    --red: #ea4335;
    --yellow: #fbbc05;
    --green: #34a853;
    --text: #202124;
    --muted: #5f6368;
    --url: #006621;
    --border: #dfe1e5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Arial, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: #fff;
    min-height: 100vh;
  }
  a { color: #1a0dab; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* 通用搜索框 */
  .searchwrap { display: flex; align-items: center; }
  .searchbox {
    display: flex; align-items: center;
    width: 100%;
    max-width: 560px;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 0 14px;
    height: 44px;
    background: #fff;
    transition: box-shadow .2s, border-color .2s;
  }
  .searchbox:focus-within {
    box-shadow: 0 1px 6px rgba(32,33,36,.28);
    border-color: rgba(223,225,229,0);
  }
  .searchbox svg { flex: 0 0 auto; fill: var(--muted); }
  .searchbox input {
    flex: 1 1 auto;
    border: none; outline: none;
    font-size: 16px;
    padding: 0 12px;
    background: transparent;
    color: var(--text);
  }
  .buttons { margin-top: 26px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    background: #f8f9fa;
    border: 1px solid #f8f9fa;
    border-radius: 4px;
    color: #3c4043;
    font-size: 14px;
    padding: 9px 16px;
    cursor: pointer;
  }
  .btn:hover { border: 1px solid #dadce0; box-shadow: 0 1px 1px rgba(0,0,0,.1); }

  /* Logo */
  .logo { font-size: 5rem; font-weight: 500; letter-spacing: -2px; user-select: none; }
  .logo span:nth-child(1){color:var(--blue);}
  .logo span:nth-child(2){color:var(--red);}
  .logo span:nth-child(3){color:var(--green);}
  .logo span:nth-child(4){color:var(--yellow);}
  .logo span:nth-child(5){color:var(--blue);}
  .logo span:nth-child(6){color:var(--red);}
  .logo span:nth-child(7){color:var(--green);}
  .logo span:nth-child(8){color:var(--yellow);}
  .logo span:nth-child(9){color:var(--blue);}

  /* 首页 */
  .hero { display: flex; flex-direction: column; align-items: center; margin-top: 18vh; padding: 0 16px; }
  .hero .searchwrap { width: 100%; justify-content: center; }
  .hero .searchbox { max-width: 584px; height: 48px; }

  /* 结果页顶栏 */
  .topbar {
    display: none;
    align-items: center;
    gap: 24px;
    padding: 14px 20px;
    border-bottom: 1px solid #eee;
  }
  .topbar .logo { font-size: 1.7rem; letter-spacing: -1px; }
  .topbar .searchwrap { width: auto; }
  .topbar .searchbox { max-width: 640px; height: 42px; }

  body.results .hero { display: none; }
  body.results .topbar { display: flex; }

  /* 结果列表 */
  .main { max-width: 680px; padding: 18px 20px 60px; margin-left: 0; }
  body.results .main { padding-top: 10px; }
  .stats { color: var(--muted); font-size: 13px; margin: 6px 0 18px; }
  .result { margin-bottom: 26px; }
  .result .title { font-size: 20px; line-height: 1.3; }
  .result .url { color: var(--url); font-size: 13px; margin: 3px 0 4px; word-break: break-all; }
  .result .snippet { color: #4d5156; font-size: 14px; line-height: 1.58; }
  .nores { color: var(--muted); font-size: 15px; }
  mark { background: #fff2a8; color: inherit; padding: 0 1px; border-radius: 2px; }
  .footer { color: var(--muted); font-size: 12px; padding: 14px 20px; border-top: 1px solid #eee; }
</style>
</head>
<body>
  <!-- 结果页顶栏 -->
  <div class="topbar">
    <a href="/" class="logo"><span>n</span><span>e</span><span>k</span><span>o</span><span>s</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span></a>
    <div class="searchwrap">
      <form class="searchbox" id="formTop" autocomplete="off">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input id="qTop" name="q" type="text" />
      </form>
    </div>
  </div>

  <!-- 首页 -->
  <div class="hero">
    <div class="logo"><span>n</span><span>e</span><span>k</span><span>o</span><span>s</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span></div>
    <div class="searchwrap">
      <form class="searchbox" id="formHome" autocomplete="off">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input id="qHome" name="q" type="text" />
      </form>
    </div>
    <div class="buttons">
      <button class="btn" id="searchBtn" type="button">搜索</button>
      <button class="btn" id="luckyBtn" type="button">手气不错</button>
    </div>
  </div>

  <!-- 结果区 -->
  <div class="main">
    <div class="stats" id="stats"></div>
    <div id="results"></div>
  </div>

  <div class="footer">nekosearch · 自托管搜索引擎 · 默认单机部署，架构天生支持集群</div>

<script>
  const TOP_K = 20;
  const params = new URLSearchParams(location.search);
  const q = params.get('q');

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function highlight(text, terms) {
    let s = esc(text);
    terms.forEach(t => {
      if (!t) return;
      const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      s = s.replace(re, '<mark>$1</mark>');
    });
    return s;
  }
  function termsOf(q) { return (q || '').toLowerCase().split(/\s+/).filter(Boolean); }

  function doSearch(query) {
    if (!query) return;
    location.search = '?q=' + encodeURIComponent(query);
  }

  async function render(query) {
    document.body.classList.add('results');
    document.getElementById('qTop').value = query;
    const stats = document.getElementById('stats');
    const list = document.getElementById('results');
    stats.textContent = '搜索中…';
    list.innerHTML = '';
    try {
      const resp = await fetch('/search?q=' + encodeURIComponent(query) + '&top_k=' + TOP_K);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      const terms = termsOf(query);
      if (!Array.isArray(data) || data.length === 0) {
        stats.textContent = '';
        list.innerHTML = '<div class="nores">未找到与 “' + esc(query) + '” 相关的结果。</div>';
        return;
      }
      stats.textContent = '约 ' + data.length + ' 条结果';
      for (const r of data) {
        const d = r.doc || {};
        const item = document.createElement('div');
        item.className = 'result';

        const title = document.createElement('div');
        const ta = document.createElement('a');
        ta.className = 'title';
        ta.href = d.url || '#';
        ta.innerHTML = highlight(d.title, terms);
        title.appendChild(ta);

        const url = document.createElement('div');
        url.className = 'url';
        url.textContent = d.url || '';

        const snip = document.createElement('div');
        snip.className = 'snippet';
        snip.innerHTML = highlight(d.body, terms);

        item.appendChild(title);
        item.appendChild(url);
        item.appendChild(snip);
        list.appendChild(item);
      }
    } catch (e) {
      stats.textContent = '';
      list.innerHTML = '<div class="nores">检索失败：' + esc(String(e.message || e)) + '</div>';
    }
  }

  document.getElementById('formHome').addEventListener('submit', e => {
    e.preventDefault(); doSearch(document.getElementById('qHome').value.trim());
  });
  document.getElementById('formTop').addEventListener('submit', e => {
    e.preventDefault(); doSearch(document.getElementById('qTop').value.trim());
  });
  document.getElementById('searchBtn').addEventListener('click', () => doSearch(document.getElementById('qHome').value.trim()));
  document.getElementById('luckyBtn').addEventListener('click', async () => {
    const query = document.getElementById('qHome').value.trim();
    if (!query) return;
    try {
      const resp = await fetch('/search?q=' + encodeURIComponent(query) + '&top_k=1');
      const data = await resp.json();
      if (Array.isArray(data) && data.length && data[0].doc && data[0].doc.url) {
        location.href = data[0].doc.url;
        return;
      }
    } catch (_) {}
    doSearch(query);
  });

  if (q) { render(q.trim()); }
</script>
</body>
</html>
