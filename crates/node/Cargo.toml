[package]
name = "nekosearch"
version.workspace = true
edition.workspace = true
description = "Self-hosted search server: single-node by default, cluster-ready (registry-managed crawler executors)"

[[bin]]
name = "nekosearch"
path = "src/main.rs"

[dependencies]
nekosearch-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
url = "2"
serde_yaml = "0.9"
# 嵌入式 KV 存储，纯 Rust、零外部依赖，契合「傻瓜式部署」；用于索引持久化。
sled = "0.34"
