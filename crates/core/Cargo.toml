[package]
name = "nekosearch-core"
version.workspace = true
edition.workspace = true
description = "Shared protocol, registry and indexer traits for nekosearch"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
