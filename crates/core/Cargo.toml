[package]
name = "nekosearch-core"
version.workspace = true
edition.workspace = true
description = "Shared protocol, registry and indexer traits for nekosearch"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
# 中文分词：纯 Rust 实现、内置词典、零外部依赖。
jieba-rs = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
